<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body align="center">
    <style align="center">
        button{
            background-color: yellow;
            color: rgb(0, 0, 0);
            padding: 12px 25px;
            transition : 0.3s;
            cursor: pointer;
            border-radius:34px;
        }

        button:hover{
            background: rgb(16, 25, 17);
        }
        legend{
            
            color:rgb(13, 255, 106);
            font-size: 30px;
            font-style: italic;
        }
    </style>
    <br>
    <br>
   
    <fieldset align="center" h1>SINE UP / LOG IN 
        
    </fieldset>


<fieldset>  
    <legend align="left">SignUp</legend>
    <form id="formData">
        <label></label>
        <input  type="text" placeholder="Enter your name"/>
        <br>
        <br>

        <input  type="email" placeholder="Enter your email"/>
        <br>

        <br>
        <input  type="password" placeholder="Enter your password"/>
        <br>
        <br>
        <button type="submit">Submit</button>
    </form>
</fieldset>
<br>
<br><br><br>
<br>

<fieldset>  
    <legend align="left">Login</legend>
    <form id="LoginData">

        <input  type="email" placeholder="Enter your email"/>
        <br>
        <br>
        <input  type="password" placeholder="Enter your password"/>
        <br>
        <br>
        <button type="submit">Submit</button>
    </form>
</fieldset>



    <script src="index.js">




    </script>
</body>
</html>
